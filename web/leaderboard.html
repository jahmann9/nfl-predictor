<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NFL Predictor Leaderboard</title>
    <link rel="stylesheet" href="app.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/supabase-client.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1 class="h1">Friend Pick Leaderboard</h1>
        <div class="nav">
          <a href="reports/summaries/season_report_2026.html">Home</a>
          <a class="active" href="leaderboard.html">Leaderboard</a>
          <a href="admin.html">Admin</a>
        </div>
      </div>

      <div class="card notice" id="config-warning" style="display:none;"></div>

      <div class="card">
        <div class="row">
          <label>Season
            <select id="season-select">
              <option value="all">All</option>
              <option>2025</option>
              <option selected>2026</option>
            </select>
          </label>
          <label>Week
            <select id="week-select">
              <option value="all">All</option>
            </select>
          </label>
          <button id="refresh-btn" class="secondary">Refresh</button>
        </div>
      </div>

      <div class="stat-grid" id="stats-grid"></div>

      <div class="card">
        <h2 style="margin-top:0;">Pick Summary</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Season</th>
                <th>Week</th>
                <th>Person</th>
                <th>Type</th>
                <th>Pick</th>
                <th>Result</th>
                <th>Updated</th>
              </tr>
            </thead>
            <tbody id="summary-rows"></tbody>
          </table>
        </div>
      </div>

      <footer>Live updates are powered by Supabase Realtime.</footer>
    </div>

    <script>
      var supabaseClient;
      var allRows = [];

      function resultBadgeHtml(result) {
        if (result === "hit") {
          return "<span style='display:inline-block;padding:2px 8px;border-radius:999px;background:#14532d;color:#bbf7d0;font-weight:800;'>✅ Hit</span>";
        }
        if (result === "miss") {
          return "<span style='display:inline-block;padding:2px 8px;border-radius:999px;background:#7f1d1d;color:#fecaca;font-weight:800;'>❌ Miss</span>";
        }
        if (result === "push") {
          return "<span style='display:inline-block;padding:2px 8px;border-radius:999px;background:#78350f;color:#fde68a;font-weight:800;'>🟨 Push</span>";
        }
        return "<span style='display:inline-block;padding:2px 8px;border-radius:999px;background:#334155;color:#cbd5e1;font-weight:800;'>Pending</span>";
      }

      function weekOptions() {
        var sel = document.getElementById("week-select");
        sel.innerHTML = "<option value='all'>All</option>";
        for (var i = 1; i <= 22; i += 1) {
          var opt = document.createElement("option");
          opt.value = String(i);
          opt.textContent = "Week " + i;
          sel.appendChild(opt);
        }
      }

      function filterRows() {
        var season = document.getElementById("season-select").value;
        var week = document.getElementById("week-select").value;
        return allRows.filter(function (r) {
          var seasonOk = season === "all" || String(r.season) === season;
          var weekOk = week === "all" || String(r.week) === week;
          return seasonOk && weekOk;
        });
      }

      function renderStats(rows) {
        var stats = {};
        window.PEOPLE.forEach(function (name) {
          stats[name] = { hits: 0, misses: 0, pushes: 0, pending: 0, total: 0 };
        });

        rows.forEach(function (r) {
          if (!stats[r.person]) return;
          stats[r.person].total += 1;
          if (r.result === "hit") stats[r.person].hits += 1;
          else if (r.result === "miss") stats[r.person].misses += 1;
          else if (r.result === "push") stats[r.person].pushes += 1;
          else stats[r.person].pending += 1;
        });

        var grid = document.getElementById("stats-grid");
        grid.innerHTML = "";

        function computeCurrentStreak(person, targetResult) {
          var personRows = rows
            .filter(function (r) { return r.person === person; })
            .slice()
            .sort(function (a, b) {
              if (a.season !== b.season) return a.season - b.season;
              if (a.week !== b.week) return a.week - b.week;
              return new Date(a.updated_at).getTime() - new Date(b.updated_at).getTime();
            })
            .filter(function (r) { return r.result === "hit" || r.result === "miss"; });

          var streak = 0;
          for (var i = personRows.length - 1; i >= 0; i -= 1) {
            if (personRows[i].result === targetResult) {
              streak += 1;
            } else {
              break;
            }
          }
          return streak;
        }

        var sortedPeople = window.PEOPLE.slice().sort(function (a, b) {
          var aStats = stats[a] || { hits: 0, misses: 0, pushes: 0, pending: 0, total: 0 };
          var bStats = stats[b] || { hits: 0, misses: 0, pushes: 0, pending: 0, total: 0 };

          if (bStats.hits !== aStats.hits) return bStats.hits - aStats.hits;
          if (aStats.misses !== bStats.misses) return aStats.misses - bStats.misses;
          if (bStats.total !== aStats.total) return bStats.total - aStats.total;
          return a.localeCompare(b);
        });

        sortedPeople.forEach(function (name) {
          var s = stats[name];
          var settled = s.hits + s.misses;
          var pctNumber = settled > 0 ? (s.hits / settled) * 100 : null;
          var pct = pctNumber !== null ? pctNumber.toFixed(1) + "%" : "N/A";
          var winStreak = computeCurrentStreak(name, "hit");
          var lossStreak = computeCurrentStreak(name, "miss");

          var barWidth = pctNumber !== null ? Math.max(0, Math.min(100, pctNumber)) : 0;
          var rateBarHtml =
            "<div style='margin-top:10px;'>" +
              "<div style='display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#94a3b8;margin-bottom:6px;'>" +
                "<span>Hit Rate</span>" +
                "<strong style='font-size:14px;color:#e2e8f0;letter-spacing:0.2px;'>" + pct + "</strong>" +
              "</div>" +
              "<div style='height:8px;border-radius:999px;background:#1e293b;overflow:hidden;'>" +
                "<div style='height:100%;width:" + barWidth + "%;background:linear-gradient(90deg,#16a34a,#84cc16);'></div>" +
              "</div>" +
            "</div>";

          var chipsHtml =
            "<div style='display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;'>" +
              "<span style='padding:4px 8px;border-radius:999px;background:#14532d;color:#bbf7d0;font-size:12px;font-weight:700;'>W Streak " + winStreak + "</span>" +
              "<span style='padding:4px 8px;border-radius:999px;background:#7f1d1d;color:#fecaca;font-size:12px;font-weight:700;'>L Streak " + lossStreak + "</span>" +
              "<span style='padding:4px 8px;border-radius:999px;background:#78350f;color:#fde68a;font-size:12px;font-weight:700;'>Push " + s.pushes + "</span>" +
              "<span style='padding:4px 8px;border-radius:999px;background:#334155;color:#cbd5e1;font-size:12px;font-weight:700;'>Pending " + s.pending + "</span>" +
              "<span style='padding:4px 8px;border-radius:999px;background:#1e3a8a;color:#bfdbfe;font-size:12px;font-weight:700;'>Picks " + s.total + "</span>" +
            "</div>";

          var div = document.createElement("div");
          div.className = "stat";
          div.innerHTML =
            "<div class='name'>" + name + "</div>" +
            "<div class='value'>" + s.hits + "-" + s.misses + "</div>" +
            rateBarHtml +
            chipsHtml;
          grid.appendChild(div);
        });
      }

      function renderSummary(rows) {
        var tbody = document.getElementById("summary-rows");
        tbody.innerHTML = "";

        rows
          .slice()
          .sort(function (a, b) {
            if (a.season !== b.season) return b.season - a.season;
            if (a.week !== b.week) return b.week - a.week;
            return a.person.localeCompare(b.person);
          })
          .forEach(function (r) {
            var tr = document.createElement("tr");
            tr.innerHTML =
              "<td>" + r.season + "</td>" +
              "<td>" + r.week + "</td>" +
              "<td>" + r.person + "</td>" +
              "<td>" + (r.pick_type === "ou" ? "O/U" : "Spread") + "</td>" +
              "<td>" + (r.pick_text || "") + "</td>" +
              "<td>" + resultBadgeHtml(r.result) + "</td>" +
              "<td>" + new Date(r.updated_at).toLocaleString() + "</td>";
            tbody.appendChild(tr);
          });
      }

      function rerender() {
        var rows = filterRows();
        renderStats(rows);
        renderSummary(rows);
      }

      async function loadData() {
        var res = await supabaseClient.from("weekly_picks").select("*");
        if (res.error) {
          document.getElementById("config-warning").style.display = "block";
          document.getElementById("config-warning").textContent = "Load error: " + res.error.message;
          return;
        }
        allRows = res.data || [];
        rerender();
      }

      async function boot() {
        try {
          supabaseClient = window.createSupabaseClient();
        } catch (e) {
          var warning = document.getElementById("config-warning");
          warning.style.display = "block";
          warning.textContent = e.message;
          return;
        }

        weekOptions();
        document.getElementById("refresh-btn").addEventListener("click", loadData);
        document.getElementById("season-select").addEventListener("change", rerender);
        document.getElementById("week-select").addEventListener("change", rerender);

        await loadData();

        supabaseClient
          .channel("weekly_picks_changes")
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "weekly_picks" },
            function () {
              loadData();
            }
          )
          .subscribe();
      }

      boot();
    </script>
  </body>
</html>
