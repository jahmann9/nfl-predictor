<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NFL Predictor Leaderboard</title>
    <link rel="stylesheet" href="app.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/supabase-client.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1 class="h1">Friend Pick Leaderboard</h1>
        <div class="nav">
          <a href="reports/summaries/season_report_2026.html">Home</a>
          <a class="active" href="leaderboard.html">Leaderboard</a>
          <a href="admin.html">Admin</a>
        </div>
      </div>

      <div class="card notice hidden" id="config-warning"></div>

      <div class="card">
        <div class="row">
          <label>Season
            <select id="season-select">
              <option value="all">All</option>
              <option>2025</option>
              <option selected>2026</option>
            </select>
          </label>
          <label>Week
            <select id="week-select">
              <option value="all">All</option>
            </select>
          </label>
          <button id="refresh-btn" class="secondary">Refresh</button>
        </div>
      </div>

      <div class="stat-grid" id="stats-grid"></div>

      <div class="card">
        <h2 class="no-margin-top">Pick Summary</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Season</th>
                <th>Week</th>
                <th>Person</th>
                <th>Type</th>
                <th>Pick</th>
                <th>Result</th>
                <th>Updated</th>
              </tr>
            </thead>
            <tbody id="summary-rows"></tbody>
          </table>
        </div>
      </div>

      <footer>Live updates are powered by Supabase Realtime.</footer>
    </div>

    <script src="js/leaderboard.js"></script>
  </body>
</html>
