name: Deploy Reports To GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate reports
        run: |
          mkdir -p site/reports
          python main.py --season 2025 --output-dir site/reports
          python main.py --season 2026 --output-dir site/reports

      - name: Copy web app assets
        run: |
          cp -R web/* site/

      - name: Create index page
        run: |
          cat > site/index.html << 'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Redirecting to 2026 Report</title>
              <meta http-equiv="refresh" content="0; url=reports/summaries/season_report_2026.html" />
              <link rel="canonical" href="reports/summaries/season_report_2026.html" />
            </head>
            <body>
              <p>Redirecting to <a href="reports/summaries/season_report_2026.html">2026 season report</a>...</p>
            </body>
          </html>
          EOF

      - name: Validate generated site files
        run: |
          required_files=(
            "site/index.html"
            "site/admin.html"
            "site/leaderboard.html"
            "site/config.js"
            "site/reports/summaries/season_report_2025.html"
            "site/reports/summaries/season_report_2025.csv"
            "site/reports/summaries/season_report_2026.html"
            "site/reports/summaries/season_report_2026.csv"
            "site/reports/figures/confusion_matrix.png"
            "site/reports/figures/spread_cover_distribution.png"
            "site/reports/figures/probability_calibration.png"
            "site/reports/figures/feature_importance.png"
          )

          missing=0
          for f in "${required_files[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "Missing required file: $f"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "Site validation failed. One or more required files were not generated."
            exit 1
          fi

          echo "Site validation passed."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
